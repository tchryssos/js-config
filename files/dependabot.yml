version: 2
updates:
  - package-ecosystem: npm # also covers pnpm lockfiles
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm-workspace.yaml's minimumReleaseAge.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3

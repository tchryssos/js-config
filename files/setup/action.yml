name: 'Setup Repo'
description: 'Setup the pnpm + node environment and install dependencies'

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        # Caches pnpm's download store, not node_modules, so every run still
        # does a real install against the lockfile.
        cache: 'pnpm'
    - name: Install deps
      run: pnpm install --frozen-lockfile
      shell: 'bash'
      env:
        CI: true

# Formats and lints staged files and re-stages the fixes, so commits are
# always formatted. Whole-project checks live in check.yml (pre-push).
pre-commit:
  jobs:
    - name: format
      run: node_modules/.bin/prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{js,mjs,cjs,ts,mts,cts,astro}'
      run: node_modules/.bin/eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true
